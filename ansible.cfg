[defaults]
inventory           = inventory/hosts.yml
roles_path          = roles
collections_path    = collections
host_key_checking   = True
interpreter_python  = auto_silent
# Lesbare Ausgabe: mehrzeilige Werte als YAML statt als eine JSON-Zeile.
#
# Bewusst NICHT `stdout_callback = yaml`: dieses Callback-Plugin ist mit
# ansible-core 2.19 aus dem Kern entfernt worden und liegt seitdem nur noch in
# community.general. Mit reinem ansible-core bricht der Aufruf dann sofort ab
# ("Could not load 'yaml' callback plugin") — und dieses Repository kommt
# absichtlich ohne Collections aus. Das Standard-Callback kann dasselbe seit
# ansible-core 2.13 von sich aus.
stdout_callback           = default
callback_result_format    = yaml
callback_format_pretty    = True
forks               = 10
retry_files_enabled = False
gathering           = smart
fact_caching        = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout    = 3600
display_skipped_hosts   = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
become_ask_pass = False
