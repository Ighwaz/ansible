---
# Legt für die ausgewählten Gäste einen Snapshot an, ohne etwas zu ändern.
# Nützlich vor manuellen Eingriffen.
#
#   ansible-playbook playbooks/snapshot.yml --limit ct-db
#   ansible-playbook playbooks/snapshot.yml -e pve_snapshot_description="vor Umzug"

- name: Snapshots anlegen
  hosts: guests
  become: true
  gather_facts: false
  max_fail_percentage: "{{ maint_max_fail_percentage | default(100) }}"

  pre_tasks:
    - name: Lauf-ID für Snapshot-Namen festlegen
      ansible.builtin.set_fact:
        maint_run_id: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%S') }}"
      run_once: true

  roles:
    - role: pve_facts
    - role: pve_snapshot
