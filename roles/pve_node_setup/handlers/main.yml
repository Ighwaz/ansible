---
- name: Dienst pveproxy neu starten
  # Ohne Neustart liefert pveproxy die alte Fassung der Datei weiter aus.
  ansible.builtin.systemd_service:
    name: pveproxy
    state: restarted
  listen: Dienst pveproxy neu starten

- name: Locales erzeugen
  # Als Handler statt inline: locale-gen braucht nur zu laufen, wenn sich
  # /etc/locale.gen tatsächlich geändert hat.
  ansible.builtin.command:
    argv: [locale-gen]
  changed_when: true
  listen: Locales erzeugen
