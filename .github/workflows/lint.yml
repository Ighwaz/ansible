---
name: Lint

# Läuft bei jedem Push auf main und bei JEDEM Pull Request.
#
# Der pull_request-Auslöser ist bewusst ohne branches-Filter: mit
# `branches: [main]` bekam ein gestapelter PR — einer, der gegen einen anderen
# Feature-Branch gestellt ist statt gegen main — überhaupt keine Prüfung. Der
# Fehler fiel nicht auf, weil ein fehlender Lauf keinen roten Haken erzeugt,
# sondern gar keinen.
on:
  push:
    branches: [main]
  pull_request:

# Zwei Läufe auf denselben Branch sind sinnlos — der ältere wird abgebrochen.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: yamllint + ansible-lint
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Ohne diese Zeile sucht setup-python nur nach **/requirements.txt
          # bzw. **/pyproject.toml und bricht ab, wenn nichts davon existiert.
          cache-dependency-path: requirements-dev.txt

      - name: Werkzeuge installieren
        # Versionen stehen gepinnt in requirements-dev.txt — dieselbe Datei,
        # die auch der pip-Cache oben als Schlüssel verwendet.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Versionen protokollieren
        # Steht im Log, damit sich ein Fehlschlag später einer Version
        # zuordnen lässt, wenn ansible-lint neue Regeln mitbringt.
        run: |
          yamllint --version
          ansible-lint --version

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint
        # --offline verhindert, dass der Lauf Collections nachlädt; alles
        # Nötige liegt im Repo.
        run: ansible-lint --offline

      - name: Syntax-Check aller Playbooks
        # Ergänzt das Linting: ansible-lint prüft Stil und Muster,
        # --syntax-check prüft, ob Ansible die Playbooks überhaupt laden kann.
        run: |
          status=0
          for playbook in playbooks/*.yml; do
            echo "::group::${playbook}"
            ansible-playbook --syntax-check "${playbook}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"
