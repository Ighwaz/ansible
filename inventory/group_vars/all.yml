---
# ---------------------------------------------------------------------------
# Globale Einstellungen für alle Hosts
# ---------------------------------------------------------------------------

ansible_user: ansible
ansible_python_interpreter: /usr/bin/python3

# Wie viele Hosts gleichzeitig gewartet werden. 1 = streng nacheinander.
# Überschreibbar per: -e maint_serial=4
maint_serial: 1

# Zentrale Zeitmarke für einen Wartungslauf (Snapshot-Namen, Report-Dateien).
# Wird einmal beim Play-Start gesetzt und ist für alle Hosts identisch.
maint_run_id: "{{ ansible_date_time.iso8601_basic_short | default(lookup('pipe', 'date -u +%Y%m%dT%H%M%S')) }}"

# Verzeichnis auf dem Controller für Health-Reports.
maint_report_dir: "{{ playbook_dir }}/../reports"

# ---------------------------------------------------------------------------
# SSH-Schlüssel
# ---------------------------------------------------------------------------
# Öffentliche Schlüssel, die auf alle Hosts ausgerollt werden. Der Name landet
# als Kommentar in der authorized_keys und macht einen Widerruf eindeutig.
#
# NUR ÖFFENTLICHE SCHLÜSSEL. Private gehören niemals ins Repository.
ssh_keys_admin: []
# Beispiel:
# ssh_keys_admin:
#   - name: laptop
#     key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... tofa@laptop"
#   - name: telefon
#     key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... tofa@telefon"

# Schlüssel, mit dem Ansible selbst arbeitet. Muss hier stehen, sonst entfernt
# ihn der exklusive Lauf beim Ansible-Benutzer — die Rolle bricht in dem Fall
# allerdings ab, statt sich auszusperren.
ssh_keys_automation: []

# Benutzer, deren authorized_keys verwaltet werden — je Eintrag der Benutzer
# und die für ihn geltenden Schlüssellisten.
#
# Steht hier und nicht nur in der Rolle, weil zwei Playbooks die Liste lesen:
# ssh-keys.yml schreibt für diese Benutzer, ssh-keys-audit.yml unterscheidet
# daran, welche gefundenen Schlüssel ein exklusiver Lauf entfernen würde.
#
# Das Feld heißt `key_sets` und nicht `keys`: In Jinja löst `eintrag.keys` auf
# die gleichnamige Methode des Dictionaries auf statt auf das Feld.
ssh_keys_targets:
  - user: "{{ ansible_user | default('ansible') }}"
    key_sets: [admin, automation]
  - user: root
    key_sets: [admin]

# authorized_keys vollständig verwalten. Erst dadurch ist ein Widerruf möglich.
ssh_keys_exclusive: true

# Passwort-Anmeldung abschalten. Greift erst, nachdem die Rolle geprüft hat,
# dass Schlüssel vorhanden sind, sshd Drop-ins einbindet, die Konfiguration
# gültig ist und eine frische Verbindung danach zustande kommt.
#
# Bewusst auf false: erst ausrollen und überprüfen, dann härten.
ssh_keys_disable_password_auth: false
