---
# Inventory für die Proxmox-Wartung.
#
# Struktur:
#   proxmox  -> die PVE-Hosts selbst (Hypervisor-Ebene)
#   lxc      -> LXC-Container (Gäste)
#   vms      -> QEMU/KVM-VMs (Gäste)
#   guests   -> Sammelgruppe aus lxc + vms, hierauf laufen alle Guest-Playbooks
#
# Pro Gast ist KEINE vmid nötig, solange der Inventory-Hostname (bzw. der Teil
# vor dem ersten Punkt) dem Namen in Proxmox entspricht — die vmid wird dann
# automatisch über `pvesh get /cluster/resources` aufgelöst.
# Weicht der Name ab, einfach `pve_vmid: 123` beim Host setzen.

all:
  children:

    proxmox:
      hosts:
        pve01:
          ansible_host: 192.0.2.10
        # pve02:
        #   ansible_host: 192.0.2.11

    lxc:
      hosts:
        ct-docker:
          ansible_host: 192.0.2.20
        ct-nginx:
          ansible_host: 192.0.2.21
          pve_vmid: 105          # Beispiel: Inventory-Name != Proxmox-Name
        ct-db:
          ansible_host: 192.0.2.22
          maint_reboot_allowed: false   # Beispiel: nie automatisch neu starten

    vms:
      hosts:
        vm-home-assistant:
          ansible_host: 192.0.2.30
        vm-build:
          ansible_host: 192.0.2.31
        vm-monitoring:
          ansible_host: 192.0.2.40

    guests:
      children:
        lxc:
        vms:

    # Hosts, auf denen Docker läuft. Bewusst eine eigene Gruppe statt eines
    # Flags am Host: so lassen sich die Docker-Playbooks ohne --limit auf
    # genau diese Menge anwenden.
    docker_hosts:
      hosts:
        vm-build:
          docker_rootless: true          # rootless-Betrieb für diesen Host
        vm-home-assistant:               # dieser läuft klassisch als root
        vm-monitoring:                   # trägt den Icinga-Stack

    # Host, auf dem der Icinga-Stack als Docker-Verbund läuft. Muss zugleich
    # in docker_hosts stehen — der Stack besteht aus Containern.
    monitoring:
      hosts:
        vm-monitoring:
          ansible_host: 192.0.2.40
